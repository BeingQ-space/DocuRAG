[project]
name = "docu-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BeingQ", email = "137730042+BeingQ-space@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "gradio>=6.29.0",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "onnxruntime>=1.30.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
docu-rag = "docu_rag:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
torch = [
    "langchain-huggingface>=1.2.2",
    "sentence-transformers>=6.1.0",
]
