# DocuRAG local orchestration

services:
  ui:
    build: .
      # builds from Dockerfile
    image: docurag:latest
    ports:
      - "7860:7860"
    volumes:
      - docurag_chroma:/app/chroma_db
      - docurag_pdfs:/app/pdf_db
    env_file:
      - .env
    environment:
      - DEMO_MODE=${DEMO_MODE:-}
  
  api:
    build: .
    image: docurag:latest
      # same image as ui (just differing in command)
    ports:
      - "8000:8000"
    volumes:
      - docurag_chroma:/app/chroma_db
      - docurag_pdfs:/app/pdf_db
    env_file:
      - .env
    command: >
      uvicorn docurag.api:app --host 0.0.0.0 --port 8000
  
volumes:
  docurag_chroma:
  docurag_pdfs:
  